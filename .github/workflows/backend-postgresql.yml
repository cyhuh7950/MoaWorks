name: Backend PostgreSQL

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgresql.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgresql.yml'

jobs:
  postgresql-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: moaworks_ci
          POSTGRES_USER: moaworks_ci
          POSTGRES_PASSWORD: moaworks_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moaworks_ci -d moaworks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: moaworks_ci
      POSTGRES_USER: moaworks_ci
      POSTGRES_PASSWORD: moaworks_ci_password
      MOAWORKS_UI041_POSTGRES_INTEGRATION: '1'
      MOAWORKS_DEF01_POSTGRES_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend dependencies
        run: pip install -r requirements-test.txt
      - name: Run PostgreSQL integration tests
        run: python -m unittest test_ui041_postgres_contacts test_content_operations_patch_help_postgres -v
      - name: Run full backend regression
        run: python -m unittest discover -s . -p "test_*.py"
