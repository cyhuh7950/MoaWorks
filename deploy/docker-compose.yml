services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
      - ../data:/app/data
    ports:
      - "${BACKEND_PORT:-8510}:8000"
    depends_on:
      - mail-layer
      - storage

  admin-web:
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8510}/api/v1
    ports:
      - "${FRONTEND_PORT:-3510}:3000"
    depends_on:
      - server

  mail-layer:
    image: alpine:3.20
    command: ["sh", "-c", "echo 'mail-layer placeholder'; tail -f /dev/null"]

  storage:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /storage/runtime /storage/files && tail -f /dev/null"]
    volumes:
      - storage-data:/storage

volumes:
  storage-data:
