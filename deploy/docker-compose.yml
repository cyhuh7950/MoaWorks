services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moaworks}
      POSTGRES_USER: ${POSTGRES_USER:-moaworks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5435}:5432"

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - ../data:/app/data
    ports:
      - "${BACKEND_PORT:-8510}:8000"
    depends_on:
      - postgres
      - mail-layer
      - storage

  admin-web:
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://server:8000
    ports:
      - "${FRONTEND_PORT:-3510}:3510"
    depends_on:
      - server

  user-web:
    build:
      context: ..
      dockerfile: deploy/user-web.Dockerfile
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://server:8000
    ports:
      - "${USER_WEB_PORT:-3520}:3520"
    depends_on:
      - server

  mail-layer:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.mail_delivery_worker"]
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - ../data:/app/data
    depends_on:
      - postgres

  mail-external-worker:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.mail_external_worker"]
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - ../data:/app/data
    depends_on:
      - postgres

  storage:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /storage/runtime /storage/files && tail -f /dev/null"]
    volumes:
      - storage-data:/storage

volumes:
  postgres-data:
  storage-data:
