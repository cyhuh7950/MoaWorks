services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moaworks}
      POSTGRES_USER: ${POSTGRES_USER:-moaworks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5435}:5432"

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - ../data:/app/data
    ports:
      - "${BACKEND_PORT:-8510}:8000"
    depends_on:
      - postgres
      - mail-layer
      - storage

  admin-web:
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
    ports:
      - "${FRONTEND_PORT:-3510}:3510"
    environment:
      ADMIN_ACCESS_CHECK_TOKEN: ${ADMIN_ACCESS_CHECK_TOKEN}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    depends_on:
      - server

  user-web:
    build:
      context: ..
      dockerfile: deploy/user-web.Dockerfile
    ports:
      - "${USER_WEB_PORT:-3520}:3520"
    depends_on:
      - server

  mail-gateway:
    build:
      context: ..
      dockerfile: deploy/mail-gateway/Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-moaworks}
      POSTGRES_USER: ${POSTGRES_USER:-moaworks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.moaworks.local}
      MAIL_INGEST_URL: http://server:8000/api/v1/internal/mail/ingest
      MAIL_INGEST_TOKEN: ${MAIL_INGEST_TOKEN:-local-inbound-change-me}
    ports:
      - "${MAIL_SMTP_PORT:-2525}:25"
    volumes:
      - mail-spool:/var/spool/postfix
    depends_on:
      - server
      - rspamd
      - clamav

  rspamd:
    image: rspamd/rspamd:3.11
    volumes:
      - ./mail-gateway/rspamd-worker-proxy.inc:/etc/rspamd/local.d/worker-proxy.inc:ro
      - ./mail-gateway/rspamd-antivirus.conf:/etc/rspamd/local.d/antivirus.conf:ro
    depends_on:
      - clamav

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav-db:/var/lib/clamav

  mail-layer:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.mail_delivery_worker"]
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - ../data:/app/data
    depends_on:
      - postgres

  mail-external-worker:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.mail_external_worker"]
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - ../data:/app/data
    depends_on:
      - postgres

  storage:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /storage/runtime /storage/files && tail -f /dev/null"]
    volumes:
      - storage-data:/storage

volumes:
  postgres-data:
  storage-data:
  mail-spool:
  clamav-db:
