services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    container_name: moaworks-server
    env_file:
      - ../.env.example
    volumes:
      - ../backend:/app
      - ../data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mail-layer
      - storage

  admin-web:
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
    container_name: moaworks-admin-web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ../frontend/admin-web:/app
    ports:
      - "3000:3000"
    depends_on:
      - server

  postgres:
    image: postgres:15-alpine
    container_name: moaworks-postgres
    environment:
      POSTGRES_DB: moaworks
      POSTGRES_USER: moaworks
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mail-layer:
    image: alpine:3.20
    container_name: moaworks-mail-layer
    command: ["sh", "-c", "echo 'mail-layer placeholder'; tail -f /dev/null"]

  storage:
    image: alpine:3.20
    container_name: moaworks-storage
    command: ["sh", "-c", "mkdir -p /storage/runtime /storage/files && tail -f /dev/null"]
    volumes:
      - storage-data:/storage

volumes:
  postgres-data:
  storage-data:
