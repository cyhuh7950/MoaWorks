services:
  server:
    container_name: moaworks-server
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: shared-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ../data:/app/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8510}:8000"
    depends_on:
      - mail-layer
      - storage
    networks:
      - app_net
      - pg_net
      - proxy_net
    restart: unless-stopped

  admin-web:
    container_name: moaworks-admin-web
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://server:8000
    expose:
      - "3510"
    depends_on:
      - server
    networks:
      - proxy_net
    restart: unless-stopped

  user-web:
    container_name: moaworks-user-web
    build:
      context: ..
      dockerfile: deploy/user-web.Dockerfile
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://server:8000
    expose:
      - "3520"
    depends_on:
      - server
    networks:
      - proxy_net
    restart: unless-stopped

  mail-layer:
    container_name: moaworks-mail-layer
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.mail_delivery_worker"]
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: shared-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ../data:/app/data
    networks:
      - app_net
      - pg_net
    restart: unless-stopped

  mail-backup-worker:
    container_name: moaworks-mail-backup-worker
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.mail_backup_worker"]
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: shared-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ../data:/app/data
    networks:
      - app_net
      - pg_net
    restart: unless-stopped

  mail-retention-worker:
    container_name: moaworks-mail-retention-worker
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: ["python", "-m", "app.workers.mail_retention_worker"]
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: shared-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ../data:/app/data
    networks:
      - app_net
      - pg_net
    restart: unless-stopped

  storage:
    container_name: moaworks-storage
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /storage/runtime /storage/files && tail -f /dev/null"]
    volumes:
      - storage-data:/storage
    networks:
      - app_net
    restart: unless-stopped

volumes:
  storage-data:

networks:
  app_net:
    name: moaworks-app-net
  pg_net:
    external: true
    name: common_default
  proxy_net:
    external: true
    name: proxy-network
