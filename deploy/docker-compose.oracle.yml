services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: shared-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ../backend:/app
      - ../data:/app/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8510}:8000"
    depends_on:
      - mail-layer
      - storage
    networks:
      - default
      - pg_net
      - proxy_net
    restart: unless-stopped

  admin-web:
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
    environment:
      VITE_API_BASE_URL: https://api.moaworks.sinsan.kr/api/v1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3510}:3510"
    depends_on:
      - server
    networks:
      - default
      - proxy_net
    restart: unless-stopped

  user-web:
    build:
      context: ..
      dockerfile: deploy/user-web.Dockerfile
    environment:
      VITE_API_BASE_URL: https://api.moaworks.sinsan.kr/api/v1
    ports:
      - "127.0.0.1:${USER_WEB_PORT:-3520}:3520"
    depends_on:
      - server
    networks:
      - default
      - proxy_net
    restart: unless-stopped

  mail-layer:
    image: alpine:3.20
    command: ["sh", "-c", "echo 'mail-layer placeholder'; tail -f /dev/null"]
    restart: unless-stopped

  storage:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /storage/runtime /storage/files && tail -f /dev/null"]
    volumes:
      - storage-data:/storage
    restart: unless-stopped

volumes:
  storage-data:

networks:
  pg_net:
    external: true
    name: common_default
  proxy_net:
    external: true
    name: proxy-network
